[package]
name = "waytime"
version = "0.2.0"
edition = "2024"
description = "Lightweight screen time and application usage tracker for Wayland"
license = "MIT"
repository = "https://github.com/nxoji/waytime"
readme = "README.md"
keywords = ["wayland", "kde", "plasma", "screen-time", "productivity"]
categories = ["command-line-utilities"]

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.1"
directories = "6.0.0"
dirs = "7.0.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "macros", "signal", "sync", "time"] }
toml = "1.1.6"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
