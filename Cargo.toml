[package]
name = "waytime"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.1"
dirs = "7.0.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt", "macros", "signal", "sync", "time"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
